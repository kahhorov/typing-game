<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Typing</title>
    <link rel="stylesheet" href="./style/main.css" />
  </head>
  <body>
    <div class="container">
      <p class="level">Level: easy</p>
      <h1 class="text">Typing...</h1>
      <input class="input" type="text" autocomplete="off" autofocus />
      <div class="footer">
        <span class="score">Ball: 0</span>
        <div class="time">
          <span class="time-minute">00</span> :
          <span class="time-secund">00</span>
        </div>
      </div>
    </div>
    <div class="overlay hidden">
      <div class="modal">
        <select class="select">
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
        </select>
        <h3 style="color: red; margin-bottom: 10px">Vaqt tugadi!!!</h3>
        <p class="scoreModal">Balingiz: 0</p>
        <button class="restartBtn">Restart</button>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
